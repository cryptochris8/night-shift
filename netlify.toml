# Netlify hosting: a static build. `npm run build` type-checks, then Vite writes dist/.
# Netlify builds and publishes every push to main. `netlify deploy --prod` publishes the
# local tree instead (it runs the build first).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Vite fingerprints everything it emits into assets/ (the scripts, the styles and the title
# narration), so those files can be cached for good. index.html keeps Netlify's default
# revalidation, so the next load after a deploy picks up the new build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
